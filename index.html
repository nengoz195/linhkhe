<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Linh Khế - Thư Viện Truyện Tranh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .font-inter { font-family: 'Inter', sans-serif; }
        .chapter-list::-webkit-scrollbar { width: 4px; }
        .chapter-list::-webkit-scrollbar-thumb { background-color: #60a5fa; border-radius: 10px; } /* Blue scrollbar */
        #particle-canvas { max-width: 100%; pointer-events: none; }
        
        /* Glass effect with Blue tint */
        .glass-card { 
            transition: all 0.3s ease; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(191, 219, 254, 0.6); 
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.1);
        }
        
        .comic-tag-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .comic-tag-card:hover { transform: translateY(-3px); }
        .loader { border: 3px solid #e0f2fe; border-top: 3px solid #2563eb; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Mobile optimize */
        body { -webkit-tap-highlight-color: transparent; }
        .text-shadow-sm { text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-blue-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SERIES_DATA = [
            {
                id: 'linh-khe-goc',
                title: "Linh Khế",
                subTitle: "Spiritpact",
                poster: "https://lh3.googleusercontent.com/pw/AP1GczNjbo5BXxddIRdCjw5_D_ZlgysBO3-3YHTMiFL-v32MIi51ut2AuP2o6HdNd1bumiaCoCKYiySt41HSllXq8MrctPlWDeJWRU_eTwh1TdIQ7wzX59y6NtBtHOvs2nXkK5gpA3__oEG4N27MScaHlbk=w670-h947-s-no-gm?authuser=0",
                desc: "Câu chuyện một người một hồn kết thành nhóm mà sống đồng thời cứu vớt thế giới. Một câu chuyện hư cấu dưới bối cảnh thành phố hiện đại về cứu rỗi và cứu rỗi bản thân...",
                author: "Bình Tử",
                jsonUrl: 'https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/data.json',
                folder: 'linh-khe'
            },
            {
                id: 'nguyet-lac-son-ha',
                title: "Linh Khế - Lạc Nguyệt Sơn Hà",
                subTitle: "Tiền truyện cổ đại",
                poster: "https://st63178.ispot.cc/stories/linh-khe-lac-nguyet-son-ha.jpg", 
                fallbackPoster: "https://st63178.ispot.cc/stories/linh-khe-lac-nguyet-son-ha.jpg",
                desc: "Câu chuyện nhỏ của hai cụ tổ.",
                author: "Bình Tử",
                jsonUrl: 'https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/data-lnsh.json',
                folder: 'nguyet-lac'
            },
            {
                id: 'linh-khe-ngoai-truyen',
                title: "Linh Khế - Ngoại Truyện",
                subTitle: "Extra Stories",
                poster: "https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/poster-nt.jpg",
                fallbackPoster: "https://lh3.googleusercontent.com/pw/AP1GczNjbo5BXxddIRdCjw5_D_ZlgysBO3-3YHTMiFL-v32MIi51ut2AuP2o6HdNd1bumiaCoCKYiySt41HSllXq8MrctPlWDeJWRU_eTwh1TdIQ7wzX59y6NtBtHOvs2nXkK5gpA3__oEG4N27MScaHlbk=w670-h947-s-no-gm?authuser=0",
                desc: "Tổng hợp những mẩu truyện ngắn, ngoại truyện vui nhộn về cuộc sống của hai nhân vật chính.",
                author: "Bình Tử",
                jsonUrl: 'https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/data-ngoai-truyen.json',
                folder: 'ngoai-truyen',
                fallbackChapters: [
                    {
                        id: "nt-chap-1",
                        title: "Ngoại Truyện: Một ngày bình yên",
                        updatedAt: "Mới cập nhật",
                        totalImages: 0,
                        folder: "ngoai-truyen",
                        images: ["https://placehold.co/600x800?text=Trang+1", "https://placehold.co/600x800?text=Trang+2"]
                    }
                ]
            }
        ];

        const SmartImage = ({ src, alt }) => {
            const [currentSrc, setCurrentSrc] = useState(src);
            const [hasError, setHasError] = useState(false);

            useEffect(() => { setCurrentSrc(src); setHasError(false); }, [src]);

            const handleError = () => {
                if (hasError) return; 
                if (currentSrc.includes('.jpg')) {
                    setHasError(true);
                    setCurrentSrc(currentSrc.replace('.jpg', '.png'));
                }
            };

            return (
                <img 
                    src={currentSrc} 
                    className="w-full h-auto block min-h-[200px] bg-gray-900" 
                    loading="lazy" 
                    onError={handleError}
                    alt={alt} 
                />
            );
        };

        function LinhKheApp() {
            const [view, setView] = useState('home');
            const [selectedSeries, setSelectedSeries] = useState(null);
            const [chapters, setChapters] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [readingChapter, setReadingChapter] = useState(null);
            const [seriesUpdates, setSeriesUpdates] = useState({});

            useEffect(() => {
                const fetchLatestUpdates = async () => {
                    const updates = {};
                    await Promise.all(SERIES_DATA.map(async (series) => {
                        try {
                            const cacheBuster = `?t=${new Date().getTime()}`;
                            const res = await fetch(series.jsonUrl + cacheBuster);
                            
                            if (!res.ok) {
                                if (series.fallbackChapters && series.fallbackChapters.length > 0) {
                                    const last = series.fallbackChapters[0];
                                    updates[series.id] = { chapterLabel: last.title, timeLabel: last.updatedAt, loaded: true, isFallback: true };
                                } else {
                                    updates[series.id] = { chapterLabel: "Chưa cập nhật", timeLabel: "--", loaded: true };
                                }
                                return;
                            }
                            
                            const data = await res.json();
                            if (data && data.length > 0) {
                                const lastChapter = data[data.length - 1];
                                updates[series.id] = {
                                    chapterLabel: lastChapter.title,
                                    timeLabel: lastChapter.updatedAt || "Vừa xong",
                                    loaded: true
                                };
                            } else {
                                updates[series.id] = { chapterLabel: "Chưa có chương", timeLabel: "--", loaded: true };
                            }
                        } catch (error) {
                            if (series.fallbackChapters) {
                                const last = series.fallbackChapters[0];
                                updates[series.id] = { chapterLabel: last.title, timeLabel: last.updatedAt, loaded: true, isFallback: true };
                            } else {
                                updates[series.id] = { chapterLabel: "Lỗi tải", timeLabel: "Thử lại sau", loaded: true };
                            }
                        }
                    }));
                    setSeriesUpdates(updates);
                };
                fetchLatestUpdates();
            }, []);

            const handleSelectSeries = async (series) => {
                setSelectedSeries(series);
                setView('detail');
                setIsLoading(true);
                try {
                    const cacheBuster = `?t=${new Date().getTime()}`;
                    const res = await fetch(series.jsonUrl + cacheBuster);
                    if (!res.ok) throw new Error("Fetch failed");
                    const data = await res.json();
                    setChapters(data);
                } catch (e) {
                    if (series.fallbackChapters) setChapters(series.fallbackChapters);
                    else setChapters([]);
                } finally {
                    setIsLoading(false);
                }
            };

            const getImgUrl = (folder, fileName) => {
                if (fileName.startsWith('http')) return fileName;
                return `https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/${folder}/${encodeURIComponent(fileName)}`;
            };

            const latestChapter = chapters.length > 0 ? chapters[chapters.length - 1] : null;

            if (view === 'reading' && readingChapter) {
                const imageList = readingChapter.images || Array.from({length: readingChapter.totalImages}, (_, i) => `${(i+1).toString().padStart(3,'0')}.jpg`);
                const currentIndex = chapters.findIndex(c => c.id === readingChapter.id);
                const prev = currentIndex > 0 ? chapters[currentIndex - 1] : null;
                const next = currentIndex < chapters.length - 1 ? chapters[currentIndex + 1] : null;

                return (
                    <div className="min-h-screen bg-gray-950 text-white font-inter pb-safe">
                        {/* Compact Header for Mobile with Blue Accent */}
                        <div className="sticky top-0 z-50 bg-gradient-to-r from-blue-900 to-slate-900 border-b border-blue-800 p-2 flex items-center justify-between shadow-xl">
                            <button onClick={() => setView('detail')} className="p-2 text-blue-200 hover:text-white active:scale-95 transition-transform">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                            </button>
                            
                            <div className="flex-1 px-2 min-w-0 text-center">
                                <h2 className="text-sm font-bold truncate text-blue-50">{readingChapter.title}</h2>
                                <p className="text-[10px] text-blue-300 truncate hidden sm:block">{selectedSeries.title}</p>
                            </div>

                            <div className="flex items-center gap-1">
                                <button 
                                    onClick={() => { setReadingChapter(prev); window.scrollTo(0,0); }} 
                                    disabled={!prev} 
                                    className={`p-2 rounded-lg transition-colors ${prev ? 'text-blue-400 hover:bg-white/10' : 'text-gray-600 cursor-not-allowed'}`}
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg>
                                </button>
                                <button 
                                    onClick={() => { setReadingChapter(next); window.scrollTo(0,0); }} 
                                    disabled={!next} 
                                    className={`p-2 rounded-lg transition-colors ${next ? 'text-blue-400 hover:bg-white/10' : 'text-gray-600 cursor-not-allowed'}`}
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
                                </button>
                            </div>
                        </div>

                        <div className="max-w-3xl mx-auto bg-black min-h-[50vh]">
                            {imageList.map((img, i) => (
                                <SmartImage key={i} src={getImgUrl(readingChapter.folder, img)} alt={`Trang ${i+1}`} />
                            ))}
                            <div className="py-12 text-center text-blue-300/50 text-sm">
                                <div>— Bạn đã đọc hết chương —</div>
                                <div className="mt-2 text-xs opacity-60">Chạm vào nút Mũi tên để chuyển chương</div>
                            </div>
                        </div>

                        {/* Bottom Navigation for easier reach */}
                         <div className="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-blue-900/50 p-3 flex justify-center sm:hidden">
                             <button onClick={() => { setView('detail'); window.scrollTo(0,0); }} className="px-6 py-2 bg-blue-700/20 rounded-full text-sm font-bold text-blue-200 hover:text-white border border-blue-700/50">
                                 Danh sách chương
                             </button>
                        </div>
                        <div className="h-16 sm:h-0"></div>
                    </div>
                );
            }

            return (
                // Restoration of the Vibrant Gradient Background
                <div className="linh-khe-wrapper font-inter text-gray-900 min-h-screen relative overflow-x-hidden" style={{ background: 'linear-gradient(135deg, #e0f2fe 0%, #bfdbfe 50%, #a5b4fc 100%)' }}>
                    <ParticleBackground />
                    
                    <div className="relative z-10 flex flex-col min-h-screen">
                        {/* Vibrant Header restored */}
                        <header className="px-4 py-3 sm:py-5 sticky top-0 z-30">
                            <div className="max-w-4xl mx-auto bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 shadow-lg shadow-blue-300/50 rounded-2xl p-3 flex items-center justify-between sm:justify-center relative">
                                {view === 'detail' && (
                                    <button onClick={() => setView('home')} className="p-1 text-white hover:bg-white/20 rounded-full md:hidden absolute left-3">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                                    </button>
                                )}
                                <h1 className="text-lg sm:text-2xl font-black text-white text-center w-full sm:w-auto drop-shadow-md cursor-pointer" onClick={() => setView('home')}>
                                    KHẾ ƯỚC LINH HỒN
                                </h1>
                            </div>
                        </header>

                        <main className="container mx-auto px-3 sm:px-4 py-2 sm:py-6 flex-grow max-w-6xl">
                            {/* HOME VIEW */}
                            {view === 'home' && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 sm:gap-8 animate-fade-in mt-2">
                                    {SERIES_DATA.map(series => {
                                        const updateInfo = seriesUpdates[series.id] || {};
                                        
                                        return (
                                            <div key={series.id} onClick={() => handleSelectSeries(series)} className="bg-white/90 backdrop-blur rounded-2xl shadow-md shadow-blue-200/50 border-2 border-blue-100 overflow-hidden active:scale-98 transition-all hover:border-blue-300 hover:shadow-xl cursor-pointer">
                                                <div className="flex sm:flex-col h-32 sm:h-auto">
                                                    {/* Poster with better sizing */}
                                                    <div className="w-24 sm:w-full shrink-0 sm:aspect-[3/4.2] relative bg-blue-50">
                                                        <img 
                                                            src={series.poster} 
                                                            onError={(e) => { e.target.src = series.fallbackPoster || "https://placehold.co/400x600?text=No+Cover"; }}
                                                            className="w-full h-full object-cover absolute inset-0"
                                                        />
                                                    </div>
                                                    {/* Content with Blue Accents */}
                                                    <div className="flex-1 p-3 sm:p-4 flex flex-col justify-center sm:justify-start min-w-0">
                                                        <h3 className="font-bold text-base sm:text-xl text-blue-900 line-clamp-1 mb-1">{series.title}</h3>
                                                        <p className="text-xs text-blue-500/80 font-semibold uppercase tracking-wider line-clamp-1 mb-2 sm:mb-4">{series.subTitle}</p>
                                                        
                                                        <div className="mt-auto flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                                                            <div className="text-xs font-bold text-white bg-blue-500 px-2 py-1 rounded-md shadow-sm w-fit truncate max-w-full">
                                                                {updateInfo.loaded ? updateInfo.chapterLabel : "..."}
                                                            </div>
                                                            <div className="text-[10px] text-gray-500 flex items-center gap-1 mt-1 sm:mt-0">
                                                                <svg className="w-3 h-3 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                                                {updateInfo.loaded ? updateInfo.timeLabel : "..."}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* DETAIL VIEW */}
                            {view === 'detail' && selectedSeries && (
                                <div className="animate-fade-in pb-10">
                                    <button onClick={() => setView('home')} className="hidden md:flex items-center gap-2 text-blue-700 font-bold bg-white/50 px-4 py-2 rounded-full hover:bg-white transition-all mb-4 w-fit shadow-sm">
                                        ⬅ Quay lại
                                    </button>

                                    <div className="glass-card rounded-2xl sm:rounded-3xl p-4 sm:p-8">
                                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6 sm:gap-8">
                                            {/* Poster */}
                                            <div className="md:col-span-4 lg:col-span-3 flex justify-center md:block">
                                                <div className="w-2/3 sm:w-3/5 md:w-full rounded-xl sm:rounded-2xl shadow-xl shadow-blue-500/20 rotate-0 md:-rotate-2 border-[4px] border-white overflow-hidden bg-gray-200 relative group">
                                                    <div className="absolute inset-0 bg-gradient-to-t from-blue-900/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                                    <img src={selectedSeries.poster} 
                                                         onError={(e) => { e.target.src = selectedSeries.fallbackPoster || "https://placehold.co/400x600?text=No+Cover"; }}
                                                         className="w-full h-auto object-cover" />
                                                </div>
                                            </div>

                                            {/* Info */}
                                            <div className="md:col-span-8 lg:col-span-9 flex flex-col">
                                                <div className="text-center md:text-left mb-4">
                                                    <h2 className="text-2xl sm:text-4xl font-black text-blue-900 leading-tight drop-shadow-sm">{selectedSeries.title}</h2>
                                                    <p className="text-blue-500 font-bold uppercase tracking-widest text-xs mt-1 bg-blue-50 inline-block px-2 py-1 rounded">{selectedSeries.subTitle}</p>
                                                </div>
                                                
                                                <div className="bg-blue-50/50 p-4 rounded-xl mb-6 text-sm border border-blue-100 shadow-inner">
                                                    <p className="text-gray-800 leading-relaxed line-clamp-4 md:line-clamp-none font-medium" onClick={(e) => e.target.classList.toggle('line-clamp-4')}>
                                                        {selectedSeries.desc}
                                                    </p>
                                                    <div className="mt-3 flex gap-4 text-xs font-bold text-gray-500 border-t border-blue-200 pt-2">
                                                        <span>Tác giả: <span className="text-blue-700">{selectedSeries.author}</span></span>
                                                        <span className="text-green-600 flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Đang tiến hành</span>
                                                    </div>
                                                </div>

                                                <div className="mb-6">
                                                    {latestChapter ? (
                                                        <button onClick={() => { setReadingChapter(latestChapter); setView('reading'); window.scrollTo(0,0); }}
                                                           className="w-full sm:w-auto flex items-center justify-center gap-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold text-base sm:text-lg py-3 px-8 rounded-full shadow-lg shadow-blue-400/40 transition-all transform active:scale-95 border border-white/20">
                                                            <span>Đọc tập mới nhất</span>
                                                            <span className="bg-white/20 px-2 py-0.5 rounded text-sm font-mono">{latestChapter.title.replace(selectedSeries.title, '').trim() || latestChapter.title}</span>
                                                        </button>
                                                    ) : (
                                                        <button disabled className="w-full sm:w-auto bg-gray-300 text-white font-bold py-3 px-6 rounded-xl cursor-not-allowed">
                                                            Chưa có chương
                                                        </button>
                                                    )}
                                                </div>

                                                <div className="flex-1 flex flex-col min-h-0">
                                                    <h3 className="text-lg font-bold text-blue-900 mb-3 flex items-center justify-between">
                                                        <span className="flex items-center gap-2">📂 Danh sách chương</span>
                                                        <span className="text-xs bg-blue-100 text-blue-600 px-3 py-1 rounded-full">{chapters.length} tập</span>
                                                    </h3>

                                                    <div className="chapter-list flex-1 overflow-y-auto pr-1 -mr-1 space-y-2 max-h-[50vh] sm:max-h-[400px]">
                                                        {isLoading ? (
                                                            <div className="flex justify-center p-8"><div className="loader"></div></div>
                                                        ) : chapters.length > 0 ? (
                                                            chapters.slice().reverse().map(ch => (
                                                                <div key={ch.id} onClick={() => { setReadingChapter(ch); setView('reading'); window.scrollTo(0,0); }}
                                                                     className="p-3 bg-white hover:bg-blue-500 hover:text-white rounded-lg cursor-pointer transition-colors flex justify-between items-center group border border-blue-100 hover:border-blue-400 shadow-sm">
                                                                    <div className="flex flex-col min-w-0 pr-2">
                                                                        <span className="font-bold text-sm text-gray-800 truncate group-hover:text-white">{ch.title}</span>
                                                                        <span className="text-[10px] text-gray-400 group-hover:text-blue-100">{ch.updatedAt || "N/A"}</span>
                                                                    </div>
                                                                    <div className="shrink-0">
                                                                         <svg className="w-5 h-5 text-blue-200 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
                                                                    </div>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <div className="text-center text-gray-400 py-8 text-sm italic">Đang cập nhật danh sách...</div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>
                        
                        {view === 'home' && (
                             <footer className="text-center py-6 text-blue-700/50 text-[10px] font-bold uppercase tracking-widest mt-auto">
                                💙 Thư viện Linh Khế 💙
                            </footer>
                        )}
                    </div>
                </div>
            );
        }

        const ParticleBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let frame, particles = [];
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                class P {
                    constructor() {
                        this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                        this.s = Math.random() * 2 + 1; this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3;
                        this.c = `hsl(${Math.random() * 60 + 190}, 100%, ${Math.random() * 40 + 60}%)`;
                    }
                    u() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
                    d() { ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fillStyle = this.c; ctx.fill(); }
                }
                const init = () => { particles = []; for(let i=0; i<30; i++) particles.push(new P()); }; 
                const loop = () => {
                    ctx.clearRect(0,0,canvas.width,canvas.height); 
                    particles.forEach(p => { p.u(); p.d(); });
                    frame = requestAnimationFrame(loop);
                };
                window.addEventListener('resize', resize); resize(); init(); loop();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(frame); };
            }, []);
            return <canvas ref={canvasRef} id="particle-canvas" className="absolute top-0 left-0 w-full h-full opacity-60" />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LinhKheApp />);
    </script>
</body>
</html>
