<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linh Khế - Thư Viện Truyện Tranh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .font-inter { font-family: 'Inter', sans-serif; }
        .chapter-list::-webkit-scrollbar { width: 6px; }
        .chapter-list::-webkit-scrollbar-thumb { background-color: #64b5f6; border-radius: 10px; }
        #particle-canvas { max-width: 100%; pointer-events: none; }
        .glass-card { transition: all 0.3s ease; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .comic-tag-card { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
        .comic-tag-card:hover { transform: translateY(-5px); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SERIES_DATA = [
            {
                id: 'linh-khe-goc',
                title: "Linh Khế",
                subTitle: "Spiritpact",
                poster: "https://lh3.googleusercontent.com/pw/AP1GczNjbo5BXxddIRdCjw5_D_ZlgysBO3-3YHTMiFL-v32MIi51ut2AuP2o6HdNd1bumiaCoCKYiySt41HSllXq8MrctPlWDeJWRU_eTwh1TdIQ7wzX59y6NtBtHOvs2nXkK5gpA3__oEG4N27MScaHlbk=w670-h947-s-no-gm?authuser=0",
                desc: "Câu chuyện một người một hồn kết thành nhóm mà sống đồng thời cứu vớt thế giới. Một câu chuyện hư cấu dưới bối cảnh thành phố hiện đại về cứu rỗi và cứu rỗi bản thân...",
                author: "Bình Tử",
                jsonUrl: 'https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/data.json',
                folder: 'linh-khe'
            },
            {
                id: 'nguyet-lac-son-ha',
                title: "Linh Khế - Lạc Nguyệt Sơn Hà",
                subTitle: "Tiền truyện cổ đại",
                poster: "image_353b7a.png",
                fallbackPoster: "https://st63178.ispot.cc/stories/linh-khe-lac-nguyet-son-ha.jpg",
                desc: "Câu chuyện nhỏ của hai cụ tổ.",
                author: "Bình Tử",
                jsonUrl: 'https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/data-lnsh.json',
                folder: 'nguyet-lac'
            }
        ];

        function LinhKheApp() {
            const [view, setView] = useState('home'); // 'home', 'detail', 'reading'
            const [selectedSeries, setSelectedSeries] = useState(null);
            const [chapters, setChapters] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [readingChapter, setReadingChapter] = useState(null);
            
            // State mới để lưu thông tin cập nhật tự động cho từng truyện
            const [seriesUpdates, setSeriesUpdates] = useState({});

            // Effect để tự động fetch thông tin mới nhất cho trang chủ
            useEffect(() => {
                const fetchLatestUpdates = async () => {
                    const updates = {};
                    
                    await Promise.all(SERIES_DATA.map(async (series) => {
                        try {
                            // Thêm timestamp để tránh cache trình duyệt
                            const cacheBuster = `?t=${new Date().getTime()}`;
                            const res = await fetch(series.jsonUrl + cacheBuster);
                            if (!res.ok) throw new Error("Network response was not ok");
                            
                            const data = await res.json();
                            
                            if (data && data.length > 0) {
                                const lastChapter = data[data.length - 1];
                                updates[series.id] = {
                                    chapterLabel: lastChapter.title,
                                    timeLabel: lastChapter.updatedAt || "Vừa xong",
                                    loaded: true
                                };
                            } else {
                                updates[series.id] = { chapterLabel: "Chưa có chương", timeLabel: "--", loaded: true };
                            }
                        } catch (error) {
                            console.error(`Lỗi tải dữ liệu cho ${series.title}:`, error);
                            updates[series.id] = { chapterLabel: "Lỗi tải", timeLabel: "Thử lại sau", loaded: true };
                        }
                    }));
                    
                    setSeriesUpdates(updates);
                };

                fetchLatestUpdates();
            }, []);

            const handleSelectSeries = async (series) => {
                setSelectedSeries(series);
                setView('detail');
                setIsLoading(true);
                try {
                    const cacheBuster = `?t=${new Date().getTime()}`;
                    const res = await fetch(series.jsonUrl + cacheBuster);
                    if (!res.ok) throw new Error("Dữ liệu chưa sẵn sàng");
                    const data = await res.json();
                    setChapters(data);
                } catch (e) {
                    console.error(e);
                    setChapters([]);
                } finally {
                    setIsLoading(false);
                }
            };

            const getImgUrl = (folder, fileName) => {
                return `https://raw.githubusercontent.com/nengoz195/data-truyen-tranh/main/${folder}/${encodeURIComponent(fileName)}`;
            };

            const latestChapter = chapters.length > 0 ? chapters[chapters.length - 1] : null;

            // Giao diện ĐỌC TRUYỆN
            if (view === 'reading' && readingChapter) {
                const imageList = readingChapter.images || Array.from({length: readingChapter.totalImages}, (_, i) => `${(i+1).toString().padStart(3,'0')}.jpg`);
                const currentIndex = chapters.findIndex(c => c.id === readingChapter.id);
                const prev = currentIndex > 0 ? chapters[currentIndex - 1] : null;
                const next = currentIndex < chapters.length - 1 ? chapters[currentIndex + 1] : null;

                return (
                    <div className="min-h-screen bg-gray-950 text-white font-inter">
                        <div className="sticky top-0 z-50 bg-blue-600 p-2 sm:p-3 flex items-center justify-between shadow-lg">
                            <button onClick={() => setView('detail')} className="p-2 bg-blue-700 hover:bg-blue-800 rounded-lg font-bold transition-colors">⬅ Quay lại</button>
                            <div className="text-center truncate flex-1 px-4">
                                <h2 className="text-sm font-bold truncate">{readingChapter.title}</h2>
                                <p className="text-[10px] opacity-70 uppercase tracking-tighter">{selectedSeries.title}</p>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={() => { setReadingChapter(prev); window.scrollTo(0,0); }} disabled={!prev} className={`p-2 rounded-lg font-bold ${prev ? 'bg-blue-700 hover:bg-blue-800' : 'bg-blue-500 opacity-50 cursor-not-allowed'}`}>Trước</button>
                                <button onClick={() => { setReadingChapter(next); window.scrollTo(0,0); }} disabled={!next} className={`p-2 rounded-lg font-bold ${next ? 'bg-blue-700 hover:bg-blue-800' : 'bg-blue-500 opacity-50 cursor-not-allowed'}`}>Sau</button>
                            </div>
                        </div>
                        <div className="max-w-3xl mx-auto bg-black pb-10">
                            {imageList.map((img, i) => (
                                <img key={i} src={getImgUrl(readingChapter.folder, img)} className="w-full h-auto block" loading="lazy" alt={`Trang ${i+1}`} />
                            ))}
                            <div className="text-center py-10 text-gray-500">— Hết chương —</div>
                        </div>
                        <div className="p-10 text-center bg-gray-900 border-t border-gray-800">
                             <button onClick={() => { setView('detail'); window.scrollTo(0,0); }} className="text-blue-400 font-bold hover:text-blue-300">Quay lại mục lục</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="linh-khe-wrapper font-inter text-gray-900 min-h-screen relative overflow-hidden" style={{ background: 'linear-gradient(160deg,#b3e5fc,#e1f5fe,#bbdefb)' }}>
                    <ParticleBackground />
                    
                    <div className="relative z-10 flex flex-col min-h-screen">
                        {/* Header */}
                        <header className="py-5 shadow-lg bg-gradient-to-r from-sky-400 via-blue-400 to-indigo-400 m-2 sm:m-4 rounded-2xl text-center">
                            <h1 className="text-3xl sm:text-4xl font-extrabold text-white drop-shadow-md">🌸 Linh Khế Series 🌸</h1>
                        </header>

                        <main className="container mx-auto px-4 py-6 flex-grow">
                            {/* TRANG CHỦ: CHỌN TAG */}
                            {view === 'home' && (
                                <div className="max-w-4xl mx-auto grid grid-cols-2 gap-6 sm:gap-10 mt-6 animate-fade-in">
                                    {SERIES_DATA.map(series => {
                                        // Lấy dữ liệu động từ state
                                        const updateInfo = seriesUpdates[series.id] || {};
                                        const chapterLabel = updateInfo.loaded ? updateInfo.chapterLabel : "Đang tải...";
                                        const timeLabel = updateInfo.loaded ? updateInfo.timeLabel : "...";

                                        return (
                                            <div key={series.id} onClick={() => handleSelectSeries(series)} className="comic-tag-card group">
                                                <div className="aspect-[3/4.2] rounded-[2rem] overflow-hidden shadow-2xl mb-4 bg-white/50 border-4 border-white relative">
                                                    <img 
                                                        src={series.poster} 
                                                        onError={(e) => { e.target.src = series.fallbackPoster || series.poster; }}
                                                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                                                    />
                                                    {/* Badge trạng thái loading nếu chưa tải xong */}
                                                    {!updateInfo.loaded && (
                                                        <div className="absolute inset-0 bg-black/20 flex items-center justify-center">
                                                            <div className="loader !w-6 !h-6 !border-2"></div>
                                                        </div>
                                                    )}
                                                </div>
                                                <h3 className="font-bold text-lg sm:text-2xl text-blue-900 line-clamp-1 px-2 mb-1 group-hover:text-blue-600 transition-colors">{series.title}</h3>
                                                <div className="flex items-center justify-between px-2">
                                                    <span className={`text-xs sm:text-sm font-bold ${updateInfo.loaded ? 'text-blue-600' : 'text-gray-400'}`}>
                                                        {chapterLabel}
                                                    </span>
                                                    <div className="flex items-center gap-1 text-gray-500 text-[10px] sm:text-xs">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                        </svg>
                                                        <span>{timeLabel}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {/* TRANG CHI TIẾT */}
                            {view === 'detail' && selectedSeries && (
                                <div className="space-y-6 animate-fade-in">
                                    <button onClick={() => setView('home')} className="flex items-center gap-2 text-blue-700 font-bold bg-white/60 px-5 py-2 rounded-full hover:bg-white transition-all shadow-sm">
                                        ⬅ Quay lại thư viện
                                    </button>

                                    <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/50">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                            {/* Poster & Info Left */}
                                            <div className="md:col-span-1">
                                                <img src={selectedSeries.poster} 
                                                     onError={(e) => { e.target.src = selectedSeries.fallbackPoster || selectedSeries.poster; }}
                                                     className="w-full h-auto rounded-2xl shadow-lg border-2 border-white/50" />
                                                <div className="mt-4 p-4 bg-blue-50/50 rounded-xl border border-blue-100/50 text-sm space-y-2">
                                                    <div className="flex justify-between">
                                                        <span className="text-blue-500 font-bold">Tác giả:</span>
                                                        <span className="text-gray-800 font-medium">{selectedSeries.author}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span className="text-blue-500 font-bold">Trạng thái:</span>
                                                        <span className="text-green-600 font-bold">Đang cập nhật</span>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Info & Chapters Right */}
                                            <div className="md:col-span-2">
                                                <h2 className="text-3xl sm:text-4xl font-black text-blue-900 mb-2">{selectedSeries.title}</h2>
                                                <p className="text-blue-500 font-bold uppercase tracking-widest text-xs mb-6">{selectedSeries.subTitle}</p>
                                                
                                                <div className="bg-white/50 p-5 rounded-2xl mb-8 border border-blue-100/30">
                                                    <h4 className="font-bold text-blue-800 mb-2">Giới thiệu:</h4>
                                                    <p className="text-gray-800 leading-relaxed italic text-sm sm:text-base">{selectedSeries.desc}</p>
                                                </div>

                                                {/* NÚT ĐỌC CHƯƠNG MỚI NHẤT (RESTORED) */}
                                                <div className="mb-10 text-center md:text-left">
                                                    {latestChapter ? (
                                                        <button onClick={() => { setReadingChapter(latestChapter); setView('reading'); window.scrollTo(0,0); }}
                                                           className="inline-flex items-center gap-3 bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 text-white font-black text-lg py-4 px-10 rounded-full shadow-xl transform transition-all duration-300 hover:scale-105 active:scale-95">
                                                            <span>💠 ĐỌC CHƯƠNG MỚI NHẤT 💠</span>
                                                            <span className="bg-white/20 px-3 py-1 rounded-lg text-sm font-bold">{latestChapter.id}</span>
                                                        </button>
                                                    ) : (
                                                        <p className="text-gray-500 italic">Đang tải dữ liệu...</p>
                                                    )}
                                                </div>

                                                <h3 className="text-2xl font-bold text-blue-800 mb-4 flex items-center justify-between">
                                                    <div className="flex items-center gap-2"><span>📖</span> Danh sách chương</div>
                                                    <span className="text-xs bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-bold">
                                                        {isLoading ? "..." : `${chapters.length} chương`}
                                                    </span>
                                                </h3>

                                                {/* DANH SÁCH CHƯƠNG (MỚI NHẤT LÊN ĐẦU) */}
                                                <div className="chapter-list max-h-[500px] overflow-y-auto pr-2 space-y-3">
                                                    {isLoading ? (
                                                        <div className="flex justify-center p-10"><div className="loader"></div></div>
                                                    ) : chapters.length > 0 ? (
                                                        chapters.slice().reverse().map(ch => (
                                                            <div key={ch.id} onClick={() => { setReadingChapter(ch); setView('reading'); window.scrollTo(0,0); }}
                                                                 className="p-4 bg-white/70 hover:bg-blue-500 hover:text-white rounded-xl cursor-pointer transition-all flex justify-between items-center group shadow-sm border border-transparent hover:border-blue-400">
                                                                <div className="flex flex-col">
                                                                    <span className="font-bold text-blue-900 group-hover:text-white transition-colors">{ch.title}</span>
                                                                    <span className="text-[10px] opacity-60 mt-1">{ch.updatedAt || "Vừa xong"}</span>
                                                                </div>
                                                                <span className="text-[10px] font-bold bg-blue-100 text-blue-500 group-hover:bg-white/20 group-hover:text-white px-2 py-1 rounded uppercase tracking-tighter">
                                                                    {ch.totalImages} trang
                                                                </span>
                                                            </div>
                                                        ))
                                                    ) : (
                                                        <p className="text-center text-gray-500 py-10 italic">Chưa có dữ liệu chương.</p>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        <footer className="text-center py-6 text-gray-600 text-[10px] sm:text-xs font-bold uppercase tracking-widest mt-auto opacity-70">
                            💙 Thư viện Linh Khế • Thiết kế bởi Thiên Trường Địa Cửu 💙
                        </footer>
                    </div>
                </div>
            );
        }

        const ParticleBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let frame, particles = [];
                const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
                class P {
                    constructor() {
                        this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                        this.s = Math.random() * 2 + 1; this.vx = (Math.random()-0.5)*0.3; this.vy = (Math.random()-0.5)*0.3;
                        this.c = `hsl(${Math.random() * 60 + 190}, 100%, ${Math.random() * 40 + 60}%)`;
                    }
                    u() { this.x += this.vx; this.y += this.vy; if(this.x<0||this.x>canvas.width)this.vx*=-1; if(this.y<0||this.y>canvas.height)this.vy*=-1; }
                    d() { ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fillStyle = this.c; ctx.fill(); }
                }
                const init = () => { particles = []; for(let i=0; i<50; i++) particles.push(new P()); };
                const loop = () => {
                    ctx.fillStyle = 'rgba(240,248,255,0.12)'; ctx.fillRect(0,0,canvas.width,canvas.height);
                    particles.forEach(p => { p.u(); p.d(); });
                    frame = requestAnimationFrame(loop);
                };
                window.addEventListener('resize', resize); resize(); init(); loop();
                return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(frame); };
            }, []);
            return <canvas ref={canvasRef} id="particle-canvas" className="absolute top-0 left-0 w-full h-full opacity-40" />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LinhKheApp />);
    </script>
</body>
</html>
